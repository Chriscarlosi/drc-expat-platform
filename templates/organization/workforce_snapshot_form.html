{% extends "frontend/base_app.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-black mb-6">Add Workforce Snapshot</h1>
    <form method="post" class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-6">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex gap-4 pt-4 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="bg-amber-500 text-white px-6 py-3 rounded-xl font-bold">Save Snapshot</button>
            <a href="{% url 'organization:workforce_snapshot_list' %}" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 px-6 py-3 rounded-xl font-bold">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
