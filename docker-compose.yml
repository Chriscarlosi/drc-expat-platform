version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: drc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - drc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - drc_redis_data:/data

volumes:
  drc_pg_data:
  drc_redis_data: